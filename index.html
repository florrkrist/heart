<!DOCTYPE html>
<html>
<head>
    <title>Mi app Python</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/brython/3.14.3/brython.min.js"></script>
</head>
<body onload="brython()">
    <h1>Python en el navegador</h1>
    <p id="salida">Cargando...</p>

    <script type="text/python">
        from browser import document
        document["salida"].text = "¡Hola desde Python!"
    </script>
</body>
</html>
